# pm MCP server —— 追加到 DSH profile 的 cordis.patch.yml（顶层 YAML 数组）。
#
# ⚠ 必须包在 `insert:` 里！
#   cordis.patch.yml 里裸的 `- id: X / name: Y` 行是「**覆盖**已有条目」，
#   id 不存在时会静默只打一行 stderr 警告：
#       patch: entry "mcp-pm" not found
#   我第一版就是这么写的，结果 MCP 一直没生效。插入必须用 insert 列表。
#
# 注册后模型会看到 9 个工具：mcp__pm__projects / cards / card / summary_queue /
# session_log / set_summary / capture / task_add / render。
#
# env.PATH 必须给：DSH 启动 MCP stdio 子进程时会 scrub 环境变量，
# 而本机 node 装在 nvm 下（pm log 解码 zstd 要用它）。
#
# 验证（不用重启）：
#   DSH_HOME=~/.dsh-preview node --import tsx/esm apps/cli/src/bin.ts \
#     --profile web --dump-config | grep -A6 mcp-pm

- insert:
    - id: mcp-pm
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: pm
        transport: stdio
        command: <pm-root>/bin/pm
        args: ['mcp']
        cwd: <pm-root>
        toolCallTimeoutMs: 180000
        env:
          PATH: <node-bin-dir>:/usr/local/bin:/usr/bin:/bin
